name: Build Loyalty Wallet APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.loyaltywallet \
            --project-name loyalty_wallet_sa \
            build_app

      - name: Copy app
        run: |
          cp pubspec.yaml build_app/
          cp -r lib build_app/

      - name: Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = """
          <uses-permission android:name="android.permission.CAMERA"/>
          <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
          <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
          """

          if "android.permission.CAMERA" not in s:
              s = s.replace("<application", permissions + "\n<application", 1)

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: build_app
        run: |
          set +e

          flutter pub get > build.log 2>&1
          RESULT=$?

          if [ $RESULT -eq 0 ]; then
            flutter build apk --debug >> build.log 2>&1
            RESULT=$?
          fi

          echo "========== BUILD OUTPUT =========="
          tail -n 80 build.log

          echo "========== ERRORS =========="
          grep -n -E "Error:|error:|FAILURE:|Exception" build.log | tail -n 30 || true

          exit $RESULT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Loyalty-Wallet-SA
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
