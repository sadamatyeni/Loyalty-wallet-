name: Build Loyalty Wallet SA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --project-name loyalty_wallet_sa build_app
          cp pubspec.yaml build_app/pubspec.yaml
          cp -r lib build_app/lib
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build_app/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    <uses-permission android:name="android.permission.CAMERA"/>\\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>')
          p.write_text(s)
          PY
      - name: Get packages
        working-directory: build_app
        run: flutter pub get
      - name: Build APK
        working-directory: build_app
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loyalty-Wallet-SA-debug-apk
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
