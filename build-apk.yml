name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check files
        run: |
          ls -la
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Create Android project
        run: flutter create --platforms=android --org com.loyaltywallet --project-name loyalty_wallet_sa build_app

      - name: Copy source code
        run: |
          cp pubspec.yaml build_app/
          cp -r lib build_app/

      - name: Add permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = """
          <uses-permission android:name="android.permission.CAMERA"/>
          <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
          <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
          """

          if "android.permission.CAMERA" not in s:
              s = s.replace("<application", permissions + "\n<application", 1)

          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get 2>&1 | tee pubget.log

      - name: Build APK and save full log
        working-directory: build_app
        run: |
          flutter build apk --debug --verbose 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostic-Logs
          path: |
            build_app/build.log
            build_app/pubget.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Loyalty-Wallet-SA-APK
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
