
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name loyalty_wallet_sa build_app

      - name: Copy and fix app source
        run: |
          cp pubspec.yaml build_app/
          mkdir -p build_app/lib
          cp main.dart build_app/lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build_app/lib/main.dart")
          s = p.read_text()
          s = s.replace(
              "import 'package:mobile_scanner/mobile_scanner.dart';",
              "import 'package:mobile_scanner/mobile_scanner.dart' as mobile_scanner;"
          )
          s = s.replace("MobileScanner(", "mobile_scanner.MobileScanner(")
          p.write_text(s)
          PY

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n'
              '    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>'
          )
          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Loyalty-Wallet-SA-APK
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
