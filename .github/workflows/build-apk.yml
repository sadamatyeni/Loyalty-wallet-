name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name loyalty_wallet_sa build_app

      - name: Copy app files
        run: |
          cp pubspec.yaml build_app/
          cp -r lib build_app/

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = '''
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
          '''
          s = s.replace("<application", permissions + "\\n    <application", 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Loyalty-Wallet-SA-APK
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
